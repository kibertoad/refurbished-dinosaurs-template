version: 2
updates:
  # The toolkit's packages: the documentation checker and executable reader (npm), the instruction
  # engine and Ghidra scripts (pip), and ScientificMethod.Core (NuGet). A standard-checker update also
  # moves the check-documentation action pin in ci.yml; see docs/UPSTREAM-RULES.md.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /tools/evidence
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

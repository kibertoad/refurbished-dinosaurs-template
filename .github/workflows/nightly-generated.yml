name: Generated documentation
# Regenerates spec/index/ and PARITY.md on main and commits them. Pull requests never change those
# files: the documentation check in ci.yml runs with scheduled-generation, so it neither writes nor
# compares them and fails a change that edits one. This job is the only writer.
#
# The job pushes to main as github-actions[bot] with the workflow's token. Where main is protected
# by a ruleset or branch protection that requires pull requests, that push is rejected until the
# repository lets it through: add GitHub Actions to the ruleset's bypass list, or store a token
# that may bypass it as a secret and use it in place of github.token below. This workflow changes
# no repository settings itself.
on:
  schedule:
    # Daily, at a minute away from the top of the hour, when scheduled runs queue longest.
    - cron: "37 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generated-documentation
  cancel-in-progress: false
jobs:
  generate:
    name: Regenerate spec indexes and parity totals
    # A dispatch from another branch would run that branch's copy of this file against main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Pushes the regenerated files to main.
      actions: read # Finds this job's last successful run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # Full history, for the log below and for the check's comparison with the base branch.
          fetch-depth: 0
      - name: Look for spec changes since the last successful run
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Started by $EVENT_NAME, so the files are regenerated whatever changed."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Changes are counted from the main commit of this job's last successful run, so a run that
          # failed, had its push rejected or never started leaves them for the next one. A skipped run
          # succeeds too, which is right: nothing had changed since the run before it.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly-generated.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" origin/main; then
            echo "No earlier successful run on the current main, so the files are regenerated."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git log --format=%H "$base..origin/main" -- spec parity deviations ':(exclude)spec/index')
          if [ -z "$changed" ]; then
            echo "No commit since $base changed spec/, parity/ or deviations/ outside spec/index/, so nothing is regenerated."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24.x
      - if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Regenerate, commit and push
        if: steps.changes.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # --generate drops the scheduled-generation input ci.yml gives, so the check writes the
            # files. Only generation matters here, so the Kaitai definitions are not compiled.
            if ! node tools/upstream.mjs docs --generate --no-ksy; then
              echo "The documentation check fails on main, so nothing is committed."
              exit 1
            fi
            if [ -z "$(git status --porcelain -- spec/index PARITY.md)" ]; then
              echo "spec/index/ and PARITY.md already match the spec and parity rows."
              exit 0
            fi
            git add --all -- spec/index PARITY.md
            git commit --quiet -m "Regenerate spec indexes and parity totals"
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              break
            fi
            echo "The push was rejected (attempt $attempt of 3); regenerating on the current main."
            git fetch --quiet "$remote" +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
          done
          echo "main kept moving, so the regenerated files were not pushed."
          exit 1

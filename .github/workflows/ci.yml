name: Continuous integration
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # A pull request runs the tests, the repository policy, and the template infrastructure
      # checks on one runner; a dispatch runs the full cross-platform matrix. Skipping this job
      # entirely on pull requests is what let a build error reach review.
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch'
          && fromJSON('["windows-latest", "ubuntu-latest", "macos-15", "macos-15-intel"]')
          || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify repository, build, and test
        shell: pwsh
        env:
          # This job builds the template unconfigured, so its project names still match
          # packages.lock.json and the pinned transitive set can actually be enforced here.
          RESTORE_LOCKED_MODE: 'true'
        run: ./tools/Invoke-Validation.ps1
      - run: dotnet publish src/Restoration.Game/Restoration.Game.csproj --no-restore -c Release --output artifacts/assetless-game -v minimal
      - run: dotnet artifacts/assetless-game/Restoration.Game.dll --smoke-test
      - name: Prove original content is absent
        shell: pwsh
        run: if (Test-Path artifacts/assetless-game/UserContent) { throw 'Assetless package contains UserContent.' }
  installer:
    name: Windows installer
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Install pinned installer compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned Inno Setup installer.' }
          gh release verify-asset $installer --repo jrsoftware/issrc
          if ($LASTEXITCODE -ne 0) { throw 'Attestation verification failed for the pinned Inno Setup installer.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($install.ExitCode)."
          }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
          -LatestOfficialVersion synthetic -AnalysisVersion synthetic
          -PatchStatusEvidence 'Synthetic CI identity' -PatchStatusEstablished
      - shell: pwsh
        run: ./tools/Build-WindowsInstaller.ps1 -Compiler "$env:INNO_COMPILER"
      - name: Smoke-test installed layout
        shell: pwsh
        run: |
          $project = Get-Content tools/project-config.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem artifacts -Filter '*-Setup-0.1.0.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not produced.' }
          $target = Join-Path $env:RUNNER_TEMP 'restoration-install-test'
          $setup = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOEXTRACT=1',"/DIR=`"$target`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $shortcut = Join-Path $startMenu "$($project.shortcutName)/$($project.shortcutName).lnk"
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target "Game/$($project.projectName).Game.exe"))
          if ($link.TargetPath -ne $expectedTarget -or [IO.Path]::GetExtension($link.TargetPath) -ne '.exe') {
            throw "Shortcut target is invalid: '$($link.TargetPath)' (expected '$expectedTarget')."
          }
          foreach ($nativeLibrary in @('SDL2.dll', 'openal.dll')) {
            $nativePath = Join-Path (Split-Path -Parent $link.TargetPath) $nativeLibrary
            if (-not (Test-Path -LiteralPath $nativePath)) { throw "Installed native library is missing: $nativePath" }
          }
          $game = Start-Process $link.TargetPath -ArgumentList '--platform-smoke-test' -WorkingDirectory $link.WorkingDirectory -PassThru
          if (-not $game.WaitForExit(120000)) {
            $game.Kill($true)
            throw 'Installed platform smoke test did not exit within 120 seconds; it is waiting on something no one can dismiss.'
          }
          if ($game.ExitCode -ne 0) { throw "Installed platform smoke test returned $($game.ExitCode)." }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind: $shortcut" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: artifacts/*-Setup-*.exe
          if-no-files-found: error
          retention-days: 1
  installer-linux:
    name: Linux installer
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
          -LatestOfficialVersion synthetic -AnalysisVersion synthetic
          -PatchStatusEvidence 'Synthetic CI identity' -PatchStatusEstablished
      - shell: pwsh
        run: ./tools/Build-LinuxInstaller.ps1
      - name: Verify Debian layout
        shell: pwsh
        run: |
          $project = Get-Content tools/project-config.json -Raw | ConvertFrom-Json
          $package = Get-ChildItem artifacts -Filter '*.deb' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'restoration-deb-test'
          dpkg-deb --info $package.FullName
          dpkg-deb --extract $package.FullName $target
          $game = Get-ChildItem $target -Recurse -Filter "$($project.projectName).Game" | Select-Object -First 1
          & $game.FullName --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installer
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 1
  installer-macos:
    name: macOS installer (${{ matrix.runtime }})
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Configure a sample identity when the template is unconfigured
        shell: pwsh
        run: >
          ./tools/Configure-Project.ps1 -SkipIfConfigured
          -ProjectName TemplateSample -DisplayName 'Template Sample'
          -OriginalTitle 'Template Sample' -OriginalDeveloper 'Template Project'
          -OriginalReleaseYear 1990 -OriginalGenre sample
          -LatestOfficialVersion synthetic -AnalysisVersion synthetic
          -PatchStatusEvidence 'Synthetic CI identity' -PatchStatusEstablished
      - shell: pwsh
        env:
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Runtime $env:TARGET_RUNTIME
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-installer-${{ matrix.runtime }}
          path: artifacts/*.pkg
          if-no-files-found: error
          retention-days: 1

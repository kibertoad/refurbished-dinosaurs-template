name: Release Windows installer
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version to tag, for example 0.1.0
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must be x.y.z.' }
          if (git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG") { throw 'Tag already exists.' }
          "version=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - uses: kibertoad/toad-discovery-center/actions/verify-repository@a72589ed38014aa7eb543bef3882b209ea2becba
      - shell: pwsh
        run: dotnet test --project tests/Restoration.Tests/Restoration.Tests.csproj --no-progress -v minimal
      - uses: kibertoad/toad-discovery-center/actions/setup-inno@a72589ed38014aa7eb543bef3882b209ea2becba
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/Build-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION -Compiler "$env:INNO_COMPILER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: artifacts/*-Setup-*.exe
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x64
          path: release-assets
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.version }}
        run: |
          $commit = git rev-parse HEAD
          $tagObject = gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" -f "tag=$env:RELEASE_TAG" -f "message=Release $env:RELEASE_TAG" -f "object=$commit" -f type=commit --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not create annotated tag object.' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$tagObject"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create tag reference.' }
          gh release create $env:RELEASE_TAG (Get-ChildItem release-assets -File).FullName --verify-tag --generate-notes --title "{{DISPLAY_NAME}} $env:RELEASE_TAG"

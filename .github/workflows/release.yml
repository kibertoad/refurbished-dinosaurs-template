name: Release installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic version to tag, for example 0.1.0
        required: true
        type: string
      installers:
        description: Installer platforms to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - no-mac-x64
          - all
      signed_release:
        description: Installer platforms to sign; macOS installers are never signed
        required: true
        default: Windows
        type: choice
        options:
          - none
          - Windows
          - Windows/Linux
permissions: {}
concurrency:
  group: release-${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^(\d+\.\d+\.\d+)$') { throw 'Tag must be x.y.z.' }
          if (git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG") { throw 'Tag already exists.' }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
  test:
    name: Test release commit
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify repository, build, and test
        shell: pwsh
        run: ./tools/Invoke-Validation.ps1
  windows:
    name: Build Windows x64 installer
    needs: [prepare, test]
    runs-on: windows-latest
    # An empty name means "no environment", so an unsigned run does not wait on the signing
    # environment's protection rules or need its secrets.
    environment: ${{ inputs.signed_release != 'none' && 'release-signing' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify eSigner configuration
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $missing = @('ES_USERNAME', 'ES_PASSWORD', 'CREDENTIAL_ID', 'ES_TOTP_SECRET') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing.Count -ne 0) {
            throw "Missing release-signing environment secret(s): $($missing -join ', ')."
          }
      - name: Install pinned installer compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          gh release download is-7_1_0 `
            --repo jrsoftware/issrc `
            --pattern 'innosetup-7.1.0-x64.exe' `
            --dir $env:RUNNER_TEMP
          gh release verify-asset $installer --repo jrsoftware/issrc
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Unexpected Inno Setup signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/SP-', '/NORESTART', "/DIR=`"$compilerRoot`"") `
            -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Inno Setup installation returned $($install.ExitCode)."
          }
          "INNO_COMPILER=$compilerRoot\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Provision software OpenGL for the platform smoke test
        shell: pwsh
        run: |
          # Hosted runners expose only the GDI generic OpenGL renderer, which has no framebuffer
          # objects, so MonoGame cannot create a graphics device. Mesa's llvmpipe can. While the
          # download is unpinned this step is a deliberate no-op: the smoke tests then run against
          # the runner's own driver and report the graphics failure themselves, which is the
          # behaviour without this step at all. Nothing is skipped or masked either way.
          try {
            $driver = ./tools/Install-MesaSoftwareGL.ps1 `
              -DestinationPath (Join-Path $env:RUNNER_TEMP 'software-opengl')
            "PLATFORM_SMOKE_TEST_GL_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Software OpenGL driver provisioned at $driver"
          }
          catch {
            Write-Warning ("Software OpenGL is unavailable, so the platform smoke tests will run " +
              "against the runner's own driver and are expected to fail: $($_.Exception.Message)")
          }
      - name: Build Windows package
        shell: pwsh
        run: ./tools/Publish-Windows.ps1 -SkipArchive
      - name: Install SSL.com CodeSignTool
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          $toolPath = ./tools/Install-CodeSignTool.ps1 `
            -DestinationPath (Join-Path $env:RUNNER_TEMP 'CodeSignTool-1.3.2')
          "CODESIGNTOOL_PATH=$toolPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Stage executables for signing
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/{{PACKAGE_ID}}-win-x64'
          $signingInput = 'artifacts/esigner-input'
          $executables = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Filter '{{PROJECT_NAME}}*.exe')
          if ($executables.Count -eq 0) { throw "No project executables were found below '$packageRoot'." }
          $duplicates = $executables | Group-Object Name | Where-Object Count -gt 1
          if ($duplicates) { throw "Executable names must be unique for signing: $($duplicates.Name -join ', ')." }
          New-Item -ItemType Directory -Path $signingInput -Force | Out-Null
          $executables | Copy-Item -Destination $signingInput
      - name: Sign Windows executables with SSL.com eSigner
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          ./tools/Invoke-ESigner.ps1 `
            -CodeSignToolPath $env:CODESIGNTOOL_PATH `
            -InputDirectory (Join-Path $PWD 'artifacts/esigner-input') `
            -OutputDirectory (Join-Path $PWD 'artifacts/esigner-output')
      - name: Install and verify signed executables
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        run: |
          $packageRoot = 'artifacts/{{PACKAGE_ID}}-win-x64'
          $expected = @(Get-ChildItem 'artifacts/esigner-input' -File -Filter '*.exe' | Select-Object -ExpandProperty Name)
          $signed = @(Get-ChildItem 'artifacts/esigner-output' -File -Filter '*.exe')
          $difference = @(Compare-Object $expected @($signed | Select-Object -ExpandProperty Name))
          if ($difference.Count -ne 0) { throw "eSigner output did not match staged executables." }
          foreach ($file in $signed) {
            $destinations = @(Get-ChildItem $packageRoot -Recurse -File -Filter $file.Name)
            if ($destinations.Count -ne 1) { throw "Expected one destination for '$($file.Name)'." }
            Copy-Item $file.FullName $destinations[0].FullName -Force
            $signature = Get-AuthenticodeSignature $destinations[0].FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "Invalid or untimestamped signature on '$($destinations[0].FullName)'."
            }
          }
      - name: Build installer from verified package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-WindowsInstaller.ps1 -Version $env:RELEASE_VERSION -Compiler "$env:INNO_COMPILER" -SkipPackage
      - name: Sign Windows installer with SSL.com eSigner
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./tools/Invoke-ESigner.ps1 `
            -CodeSignToolPath $env:CODESIGNTOOL_PATH `
            -InputFile (Join-Path $PWD "artifacts/{{PACKAGE_ID}}-Setup-$env:RELEASE_VERSION.exe")
      - name: Verify signed installer
        if: ${{ inputs.signed_release != 'none' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = "artifacts/{{PACKAGE_ID}}-Setup-$env:RELEASE_VERSION.exe"
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw "Invalid or untimestamped signature on '$installer'."
          }
      - name: Smoke-test installed layout and shortcut
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'restoration-release-install-test'
          $installer = "artifacts/{{PACKAGE_ID}}-Setup-$env:RELEASE_VERSION.exe"
          $setup = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOEXTRACT=1',"/DIR=`"$target`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer returned $($setup.ExitCode)." }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\{{SHORTCUT_NAME}}\{{SHORTCUT_NAME}}.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw "Start menu shortcut is missing: $shortcut" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target 'Game/Restoration.Game.exe'))
          if ($link.TargetPath -ne $expectedTarget) { throw "Shortcut target is invalid: '$($link.TargetPath)'." }
          if ($env:SIGNED_RELEASE -ne 'none') {
            $signature = Get-AuthenticodeSignature $link.TargetPath
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
              throw "Installed executable has an invalid or missing timestamped signature."
            }
          }
          # Same as the CI smoke test: bound the wait and surface the reason. Unbounded, a launch
          # that stops on a dialog nobody can dismiss holds the release job until it times out.
          $smokeOut = Join-Path $env:RUNNER_TEMP 'platform-smoke-stdout.txt'
          $smokeErr = Join-Path $env:RUNNER_TEMP 'platform-smoke-stderr.txt'
          function Write-SmokeDiagnostics {
            foreach ($file in @($smokeOut, $smokeErr)) {
              if ((Test-Path -LiteralPath $file) -and (Get-Item -LiteralPath $file).Length -gt 0) {
                Write-Host "--- $(Split-Path -Leaf $file) ---"
                Get-Content -LiteralPath $file | Write-Host
              }
            }
            Get-ChildItem -LiteralPath $env:LOCALAPPDATA -Recurse -Depth 3 -Filter 'startup-error.log' `
              -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName | Write-Host
              }
          }
          # The flag is accepted only when a driver was provisioned above; the game refuses it
          # otherwise, which is what keeps this mode out of a player's hands.
          $smokeArguments = @('--platform-smoke-test')
          if ($env:PLATFORM_SMOKE_TEST_GL_DRIVER) { $smokeArguments += '--software-renderer' }
          $game = Start-Process $link.TargetPath -ArgumentList $smokeArguments `
            -WorkingDirectory $link.WorkingDirectory -PassThru `
            -RedirectStandardOutput $smokeOut -RedirectStandardError $smokeErr
          if (-not $game.WaitForExit(120000)) {
            Write-SmokeDiagnostics
            $game.Kill($true)
            throw 'Installed platform smoke test did not exit within 120 seconds.'
          }
          if ($game.ExitCode -ne 0) {
            Write-SmokeDiagnostics
            throw "Installed platform smoke test returned $($game.ExitCode)."
          }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $shortcut) { throw "Uninstaller left the Start menu shortcut behind: $shortcut" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: artifacts/*.exe
          if-no-files-found: error
          retention-days: 1
  linux:
    name: Build Linux x64 installer
    needs: [prepare, test]
    if: ${{ inputs.installers != 'windows' }}
    runs-on: ubuntu-latest
    # See the Windows job: an empty name means "no environment".
    environment: ${{ inputs.signed_release == 'Windows/Linux' && 'release-signing' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Verify OpenPGP configuration
        if: ${{ inputs.signed_release == 'Windows/Linux' }}
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: ./tools/Invoke-GpgSigner.ps1 -TestConfiguration
      - shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./tools/Build-LinuxInstaller.ps1 -Version $env:RELEASE_VERSION
      - name: Sign Linux installer with OpenPGP
        if: ${{ inputs.signed_release == 'Windows/Linux' }}
        shell: pwsh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./tools/Invoke-GpgSigner.ps1 -InputFile (Join-Path $PWD `
            "artifacts/{{PACKAGE_ID}}-linux-x64-Setup-$env:RELEASE_VERSION.deb")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            artifacts/*.deb
            artifacts/*.deb.asc
          if-no-files-found: error
          retention-days: 1
  macos:
    name: Build macOS installer (${{ matrix.runtime }})
    needs: [prepare, test]
    if: ${{ inputs.installers != 'windows' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            runtime: osx-arm64
          - arch: x64
            os: macos-15-intel
            runtime: osx-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - if: ${{ matrix.arch != 'x64' || inputs.installers == 'all' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_RUNTIME: ${{ matrix.runtime }}
        run: ./tools/Build-MacInstaller.ps1 -Version $env:RELEASE_VERSION -Runtime $env:TARGET_RUNTIME
      - if: ${{ matrix.arch != 'x64' || inputs.installers == 'all' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: artifacts/*.pkg
          if-no-files-found: error
          retention-days: 1
  release:
    name: Publish release
    needs: [prepare, windows, linux, macos]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.windows.result == 'success' &&
        (inputs.installers == 'windows' ||
          (needs.linux.result == 'success' && needs.macos.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the annotated tag and GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create annotated tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve release commit.' }
          $tagObject = gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/tags" `
            -f "tag=$env:RELEASE_TAG" -f "message=Release $env:RELEASE_TAG" `
            -f "object=$commit" -f 'type=commit' | ConvertFrom-Json
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
            -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$($tagObject.sha)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release tag reference.' }
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_INSTALLERS: ${{ inputs.installers }}
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print | sort)
          expected=1
          if [[ "$RELEASE_INSTALLERS" == no-mac-x64 ]]; then expected=3; fi
          if [[ "$RELEASE_INSTALLERS" == all ]]; then expected=4; fi
          if [[ "$SIGNED_RELEASE" == Windows/Linux && "$RELEASE_INSTALLERS" != windows ]]; then ((expected+=1)); fi
          if (( ${#assets[@]} != expected )); then
            echo "Expected $expected installer(s), found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "{{DISPLAY_NAME}} $RELEASE_TAG"

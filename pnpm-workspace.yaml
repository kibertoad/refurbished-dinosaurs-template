# pnpm holds back releases younger than its minimum release age. `node tools/upstream.mjs refresh`
# takes a checker release as soon as it is tagged, so it keeps the checker's entry here on the
# version package.json pins.
minimumReleaseAgeExclude:
  - '@scientific-method/standard-checker@4.2.0'
  # The reader that speaks prepared-config protocol 3, as engine 19.1 does.
  - '@scientific-method/executable-reader@4.1.0'
